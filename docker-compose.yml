version: "3.8"

services:
  # Clips X Backend & Web Application
  app:
    build: .
    container_name: clipsx-app
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      - clipsx-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflare Tunnel Sidecar (Zero Trust / Automated HTTPS & CDN)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: clipsx-tunnel
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    # If no token is provided, comment the command above and uncomment below for a free trycloudflare URL:
    # command: tunnel --url http://app:8765

volumes:
  clipsx-data:
    driver: local
