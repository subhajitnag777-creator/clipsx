<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · Clips X</title>
<meta name="description" content="Reset the password for your Clips X account.">
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/brand/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --yellow-50: #FFFDF5;
  --yellow-100: #FEF9C3;
  --yellow-200: #FEF08A;
  --yellow-500: #EAB308;
  --amber-500: #F59E0B;
  --amber-600: #D97706;
  --gold-grad: linear-gradient(135deg, #FFB800 0%, #F59E0B 100%);
  --gold-glow: 0 10px 28px -4px rgba(245, 158, 11, 0.35);
  --gold-border: rgba(245, 158, 11, 0.28);
  --text-main: #18181B;
  --text-dim: #52525B;
  --text-faint: #A1A1AA;
  --line: #E4E4E7;
  --bad: #DC2626;
  --bad-bg: #FEF2F2;
  --ok: #16A34A;
  --ok-bg: #F0FDF4;
  --r: 14px;
  --r-xl: 24px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: #FFFFFF;
  background-image:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(254, 240, 138, 0.32) 0%, rgba(255, 255, 255, 0) 70%),
    radial-gradient(circle at 100% 100%, rgba(254, 249, 195, 0.25) 0%, rgba(255, 255, 255, 0) 50%);
  color: var(--text-main);
  font: 15px/1.55 "Geist", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  position: relative;
  overflow-x: hidden;
}

/* Central Card */
.auth-viewport {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
}
.auth-card {
  background: #FFFFFF;
  border: 1px solid var(--gold-border);
  border-radius: var(--r-xl);
  padding: 38px 34px;
  box-shadow: 0 24px 64px -12px rgba(245, 158, 11, 0.18), 0 10px 30px -4px rgba(0, 0, 0, 0.06);
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: var(--gold-grad);
}
.brand-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  margin-bottom: 20px;
}
.brand-logo-icon {
  width: 32px;
  height: 32px;
  background: var(--gold-grad);
  border-radius: 8px;
  display: grid;
  place-items: center;
}
.brand-logo-icon svg {
  width: 18px;
  height: 18px;
  fill: #18181B;
}
.brand-text {
  font-size: 19px;
  font-weight: 800;
  color: #18181B;
}
.brand-text span {
  color: var(--amber-600);
}
h2 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #18181B;
}
p.sub {
  font-size: 14px;
  color: var(--text-dim);
  margin: 6px 0 22px;
}
form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
input {
  height: 48px;
  padding: 0 14px;
  border-radius: var(--r);
  border: 1.5px solid var(--line);
  background: #FAFAFA;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--text-main);
  outline: none;
  transition: all 0.2s ease;
}
input:focus {
  border-color: var(--amber-500);
  background: #FFFFFF;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 1000px #FAFAFA inset !important;
  box-shadow: 0 0 0 1000px #FAFAFA inset !important;
  -webkit-text-fill-color: var(--text-main) !important;
  transition: background-color 5000s ease-in-out 0s;
}
.hint {
  font-size: 12px;
  color: var(--text-faint);
  font-weight: 400;
}
.btn-primary {
  width: 100%;
  height: 50px;
  background: var(--gold-grad);
  border: 1px solid rgba(217, 119, 6, 0.4);
  border-radius: var(--r);
  color: #18181B;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--gold-glow);
  transition: all 0.2s ease;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px -4px rgba(245, 158, 11, 0.45);
}
.err {
  display: none;
  background: var(--bad-bg);
  border: 1px solid rgba(220, 38, 38, 0.2);
  color: var(--bad);
  padding: 12px 14px;
  border-radius: var(--r);
  font-size: 13.5px;
  font-weight: 500;
}
.err.on { display: block; }
.okbox {
  background: var(--ok-bg);
  border: 1px solid rgba(22, 163, 74, 0.2);
  color: var(--ok);
  padding: 14px 16px;
  border-radius: var(--r);
  font-size: 14px;
  line-height: 1.5;
}
.swap {
  margin-top: 22px;
  text-align: center;
  font-size: 14px;
  color: var(--text-dim);
}
.swap a {
  color: var(--amber-600);
  font-weight: 600;
  text-decoration: none;
}
.swap a:hover {
  text-decoration: underline;
}
.cf-turnstile-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 6px 0;
  min-height: 65px;
}
.cf-turnstile-wrap:empty { display: none; }
</style>
</head>
<body>
<div class="auth-viewport">
  <div class="auth-card">
    <a href="/" class="brand-link" aria-label="Clips X Home">
      <img src="/brand/clipsx-full.png?v=clipsx3" alt="Clips X" style="height:44px;width:auto;object-fit:contain;display:block;">
    </a>

    <h2 id="h">Reset your password</h2>
    <p class="sub" id="p">Enter your email and we'll send you a link to choose a new password.</p>

    <form id="ask" autocomplete="off" novalidate>
      <div class="err" id="err" role="alert"></div>
      <label>Email Address<input id="email" type="email" autocomplete="off" placeholder="you@example.com" required></label>
      <div id="turnstileForgot" class="cf-turnstile-wrap"></div>
      <button class="btn-primary" id="go1">Send Reset Link</button>
    </form>

    <div id="sent" hidden>
      <div class="okbox">If there's an account for that email, a password reset link is on its way. It remains valid for one hour. Check your spam folder if you don't see it.</div>
    </div>

    <form id="set" autocomplete="off" novalidate hidden>
      <div class="err" id="err2" role="alert"></div>
      <label>New Password<input id="pw" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"><span class="hint">At least 8 characters.</span></label>
      <label>Confirm Password<input id="pw2" type="password" autocomplete="new-password" required minlength="8" placeholder="Type password again"></label>
      <div id="turnstileReset" class="cf-turnstile-wrap"></div>
      <button class="btn-primary" id="go2">Save New Password</button>
    </form>

    <p class="swap"><a href="/login">← Back to Sign In</a></p>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search), token = q.get("t");
const $ = id => document.getElementById(id);
const fail = (box, m) => { $(box).textContent = m; $(box).classList.add("on"); };

const isApiKeyToken = v => Boolean(v && typeof v === "string" && (v.startsWith("sk-") || v.startsWith("api_") || v.startsWith("AIza") || v.startsWith("gsk_") || v.startsWith("xai-") || v.includes("VGOVIV") || (v.length >= 32 && !v.includes(" "))));
const wipePw = () => ["pw", "pw2"].forEach(id => { const el = $(id); if (el && isApiKeyToken(el.value)) el.value = ""; });
wipePw();
setInterval(wipePw, 100);

if (token) {
  $("ask").hidden = true; $("set").hidden = false;
  $("h").textContent = "Choose a new password"; $("p").textContent = "You'll be signed in and signed out everywhere else.";
}

// Turnstile Integration
let turnstileConfig = { enabled: false, sitekey: "" };
let widgetForgotId = null, widgetResetId = null;

async function initTurnstile() {
  try {
    const res = await fetch("/api/public");
    const data = await res.json();
    if (data.turnstile && data.turnstile.enabled && data.turnstile.sitekey) {
      turnstileConfig = data.turnstile;
      loadTurnstileScript();
    }
  } catch {}
}

function loadTurnstileScript() {
  if (document.getElementById("turnstileScript")) return;
  const script = document.createElement("script");
  script.id = "turnstileScript";
  script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoaded&render=explicit";
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}

window.onTurnstileLoaded = function() {
  if (!turnstileConfig.sitekey || typeof turnstile === "undefined") return;
  const cForgot = $("turnstileForgot"), cReset = $("turnstileReset");
  if (cForgot && !widgetForgotId) {
    widgetForgotId = turnstile.render(cForgot, { sitekey: turnstileConfig.sitekey, theme: "light" });
  }
  if (cReset && !widgetResetId) {
    widgetResetId = turnstile.render(cReset, { sitekey: turnstileConfig.sitekey, theme: "light" });
  }
};

initTurnstile();

$("ask").addEventListener("submit", async e => {
  e.preventDefault(); $("err").classList.remove("on");
  const email = $("email").value.trim(); if (!email) return fail("err", "Enter your email.");
  let turnstile_token = "";
  if (turnstileConfig.enabled && typeof turnstile !== "undefined" && widgetForgotId != null) {
    turnstile_token = turnstile.getResponse(widgetForgotId);
    if (!turnstile_token) return fail("err", "Please complete the security challenge verification.");
  }
  $("go1").disabled = true;
  try {
    const r = await fetch("/api/auth/forgot", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email, turnstile_token})
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (typeof turnstile !== "undefined" && widgetForgotId != null) turnstile.reset(widgetForgotId);
      throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Try again.");
    }
    $("ask").hidden = true; $("sent").hidden = false;
  } catch (err) { fail("err", err.message); $("go1").disabled = false; }
});

$("set").addEventListener("submit", async e => {
  e.preventDefault(); $("err2").classList.remove("on");
  const a = $("pw").value, b = $("pw2").value;
  if (a.length < 8) return fail("err2", "Use at least 8 characters.");
  if (a !== b) return fail("err2", "The two passwords don't match.");
  let turnstile_token = "";
  if (turnstileConfig.enabled && typeof turnstile !== "undefined" && widgetResetId != null) {
    turnstile_token = turnstile.getResponse(widgetResetId);
    if (!turnstile_token) return fail("err2", "Please complete the security challenge verification.");
  }
  $("go2").disabled = true;
  try {
    const r = await fetch("/api/auth/reset", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token, password:a, turnstile_token})
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (typeof turnstile !== "undefined" && widgetResetId != null) turnstile.reset(widgetResetId);
      throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Try again.");
    }
    location.href = "/app";
  } catch (err) { fail("err2", err.message); $("go2").disabled = false; }
});
</script>
</body>
</html>
