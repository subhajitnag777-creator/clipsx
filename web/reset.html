<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · Clips X</title>
<meta name="description" content="Reset the password for your Clips X account.">
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --yellow-50: #FFFDF5;
  --yellow-100: #FEF9C3;
  --yellow-200: #FEF08A;
  --yellow-500: #EAB308;
  --amber-500: #F59E0B;
  --amber-600: #D97706;
  --gold-grad: linear-gradient(135deg, #FFB800 0%, #F59E0B 100%);
  --gold-glow: 0 10px 28px -4px rgba(245, 158, 11, 0.35);
  --gold-border: rgba(245, 158, 11, 0.28);
  --text-main: #18181B;
  --text-dim: #52525B;
  --text-faint: #A1A1AA;
  --line: #E4E4E7;
  --bad: #DC2626;
  --bad-bg: #FEF2F2;
  --ok: #16A34A;
  --ok-bg: #F0FDF4;
  --r: 14px;
  --r-xl: 24px;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: #FFFFFF;
  background-image:
    radial-gradient(ellipse 70% 45% at 50% 0%, rgba(254, 240, 138, 0.32) 0%, rgba(255, 255, 255, 0) 70%),
    radial-gradient(circle at 100% 100%, rgba(254, 249, 195, 0.25) 0%, rgba(255, 255, 255, 0) 50%);
  color: var(--text-main);
  font: 15px/1.55 "Geist", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  position: relative;
  overflow-x: hidden;
}

/* Central Card */
.auth-viewport {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
}
.auth-card {
  background: #FFFFFF;
  border: 1px solid var(--gold-border);
  border-radius: var(--r-xl);
  padding: 38px 34px;
  box-shadow: 0 24px 64px -12px rgba(245, 158, 11, 0.18), 0 10px 30px -4px rgba(0, 0, 0, 0.06);
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: var(--gold-grad);
}
.brand-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  margin-bottom: 20px;
}
.brand-logo-icon {
  width: 32px;
  height: 32px;
  background: var(--gold-grad);
  border-radius: 8px;
  display: grid;
  place-items: center;
}
.brand-logo-icon svg {
  width: 18px;
  height: 18px;
  fill: #18181B;
}
.brand-text {
  font-size: 19px;
  font-weight: 800;
  color: #18181B;
}
.brand-text span {
  color: var(--amber-600);
}
h2 {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #18181B;
}
p.sub {
  font-size: 14px;
  color: var(--text-dim);
  margin: 6px 0 22px;
}
form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
label {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
input {
  height: 48px;
  padding: 0 14px;
  border-radius: var(--r);
  border: 1.5px solid var(--line);
  background: #FAFAFA;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--text-main);
  outline: none;
  transition: all 0.2s ease;
}
input:focus {
  border-color: var(--amber-500);
  background: #FFFFFF;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
}
.hint {
  font-size: 12px;
  color: var(--text-faint);
  font-weight: 400;
}
.btn-primary {
  width: 100%;
  height: 50px;
  background: var(--gold-grad);
  border: 1px solid rgba(217, 119, 6, 0.4);
  border-radius: var(--r);
  color: #18181B;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--gold-glow);
  transition: all 0.2s ease;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 34px -4px rgba(245, 158, 11, 0.45);
}
.err {
  display: none;
  background: var(--bad-bg);
  border: 1px solid rgba(220, 38, 38, 0.2);
  color: var(--bad);
  padding: 12px 14px;
  border-radius: var(--r);
  font-size: 13.5px;
  font-weight: 500;
}
.err.on { display: block; }
.okbox {
  background: var(--ok-bg);
  border: 1px solid rgba(22, 163, 74, 0.2);
  color: var(--ok);
  padding: 14px 16px;
  border-radius: var(--r);
  font-size: 14px;
  line-height: 1.5;
}
.swap {
  margin-top: 22px;
  text-align: center;
  font-size: 14px;
  color: var(--text-dim);
}
.swap a {
  color: var(--amber-600);
  font-weight: 600;
  text-decoration: none;
}
.swap a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
<div class="auth-viewport">
  <div class="auth-card">
    <a href="/" class="brand-link">
      <div class="brand-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M19.5 6.19a3.02 3.02 0 0 0-2.12-2.14C15.5 3.55 12 3.55 12 3.55s-3.5 0-5.38.5A3.02 3.02 0 0 0 4.5 6.19C4 8.07 4 12 4 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.5 5.38.5 5.38.5s3.5 0 5.38-.5a3.02 3.02 0 0 0 2.12-2.14C20 15.93 20 12 20 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>
      </div>
      <div class="brand-text">Clips <span>X</span></div>
    </a>

    <h2 id="h">Reset your password</h2>
    <p class="sub" id="p">Enter your email and we'll send you a link to choose a new password.</p>

    <form id="ask" novalidate>
      <div class="err" id="err" role="alert"></div>
      <label>Email Address<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <button class="btn-primary" id="go1">Send Reset Link</button>
    </form>

    <div id="sent" hidden>
      <div class="okbox">If there's an account for that email, a password reset link is on its way. It remains valid for one hour. Check your spam folder if you don't see it.</div>
    </div>

    <form id="set" novalidate hidden>
      <div class="err" id="err2" role="alert"></div>
      <label>New Password<input id="pw" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"><span class="hint">At least 8 characters.</span></label>
      <label>Confirm Password<input id="pw2" type="password" autocomplete="new-password" required minlength="8" placeholder="Type password again"></label>
      <button class="btn-primary" id="go2">Save New Password</button>
    </form>

    <p class="swap"><a href="/login">← Back to Sign In</a></p>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search), token = q.get("t");
const $ = id => document.getElementById(id);
const fail = (box, m) => { $(box).textContent = m; $(box).classList.add("on"); };
if (token) {
  $("ask").hidden = true; $("set").hidden = false;
  $("h").textContent = "Choose a new password"; $("p").textContent = "You'll be signed in and signed out everywhere else.";
}
$("ask").addEventListener("submit", async e => {
  e.preventDefault(); $("err").classList.remove("on");
  const email = $("email").value.trim(); if (!email) return fail("err", "Enter your email.");
  $("go1").disabled = true;
  try {
    const r = await fetch("/api/auth/forgot", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Try again.");
    $("ask").hidden = true; $("sent").hidden = false;
  } catch (err) { fail("err", err.message); $("go1").disabled = false; }
});
$("set").addEventListener("submit", async e => {
  e.preventDefault(); $("err2").classList.remove("on");
  const a = $("pw").value, b = $("pw2").value;
  if (a.length < 8) return fail("err2", "Use at least 8 characters.");
  if (a !== b) return fail("err2", "The two passwords don't match.");
  $("go2").disabled = true;
  try {
    const r = await fetch("/api/auth/reset", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({token, password:a})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Try again.");
    location.href = "/app";
  } catch (err) { fail("err2", err.message); $("go2").disabled = false; }
});
</script>
</body>
</html>
